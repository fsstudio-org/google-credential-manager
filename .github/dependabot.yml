version: 2
updates:
  # Keeps the pinned actions in .github/workflows/ current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    ignore:
      # v6 moves Gradle caching into a proprietary component that needs Gradle's
      # Terms of Use accepted in CI. Stay on the MIT-licensed v5.
      - dependency-name: gradle/actions
        update-types: ['version-update:semver-major']
