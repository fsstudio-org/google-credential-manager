# What this proves: the JS layer passes its tests, and both native modules compile
# inside a host app (Android on Linux, iOS on macOS).
#
# What it cannot prove: that signing in works. That needs a real Google account
# completing a consent screen, which a runner cannot do, and putting an account's
# credentials in CI secrets would break Google's terms and get it locked. Device
# behaviour is verified by hand — see docs/manual-verification.md.
#
# Both native jobs build the example twice. `floor` is the oldest Expo SDK / React
# Native the peerDependencies allow, so breaks in the oldest supported API show
# up. `latest` upgrades the example to the newest Expo SDK first, so breaks in
# newer React Native APIs show up too (0.86 once failed to compile code that was
# fine on 0.83). A weekly run catches new releases without needing a commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # `pnpm install` above already ran `prepare` (bob build), so a broken build
      # fails that step first. This names the build as its own step.
      - run: pnpm build

  android:
    name: Build Android (${{ matrix.expo }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        expo: [floor, latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - run: pnpm install --frozen-lockfile

      # The Kotlin only compiles inside a host app: codegen emits the TurboModule
      # spec base class at app build time, so `gradle assemble` in android/ can't
      # work on its own.
      - name: Install example dependencies
        working-directory: example
        run: pnpm install --no-frozen-lockfile

      # Only in this runner's copy of the example; nothing is committed.
      - name: Upgrade example to the latest Expo SDK
        if: matrix.expo == 'latest'
        working-directory: example
        run: |
          pnpm add expo@latest
          npx expo install --fix

      - name: Prebuild example
        working-directory: example
        env:
          EXPO_PUBLIC_WEB_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
          EXPO_PUBLIC_IOS_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
        run: npx expo prebuild --platform android --clean

      - uses: gradle/actions/setup-gradle@v5

      - name: Assemble debug APK
        working-directory: example/android
        run: ./gradlew assembleDebug --no-daemon

  ios:
    name: Build iOS (${{ matrix.expo }})
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        expo: [floor, latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install example dependencies
        working-directory: example
        run: pnpm install --no-frozen-lockfile

      # Only in this runner's copy of the example; nothing is committed.
      - name: Upgrade example to the latest Expo SDK
        if: matrix.expo == 'latest'
        working-directory: example
        run: |
          pnpm add expo@latest
          npx expo install --fix

      # `--no-install` because prebuild reports a failed `pod install` as a warning
      # and carries on, which leaves no .xcworkspace and a misleading error later.
      - name: Prebuild example
        working-directory: example
        env:
          EXPO_PUBLIC_WEB_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
          EXPO_PUBLIC_IOS_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
        run: npx expo prebuild --platform ios --clean --no-install

      # This is where the GoogleSignIn ~> 9.0 pin and the podspec are exercised.
      - name: Install pods
        working-directory: example/ios
        run: pod install

      # Compile only, for the simulator and unsigned. The workspace and scheme
      # names come from the app name, so they are discovered rather than spelled.
      - name: Build for the iOS simulator
        working-directory: example/ios
        run: |
          workspace=$(ls -d *.xcworkspace)
          scheme="${workspace%.xcworkspace}"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
