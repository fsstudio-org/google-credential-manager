buildscript {
  ext.GoogleCredentialManagerLogin = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36,
    targetSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return GoogleCredentialManagerLogin[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

android {
  namespace "com.googlecredentialmanagerlogin"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
    targetSdkVersion getExtOrDefault("targetSdkVersion")
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lint {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "androidx.credentials:credentials:1.6.0"
  implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
  implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
  // Credential Manager only ever returns an ID token. Access tokens, extra OAuth
  // scopes, serverAuthCode and revokeAccess() come from Google's separate
  // Authorization API, which lives here. Always on the classpath, because the
  // module compiles against it. 21.4.0 is the floor: AuthorizationClient.revokeAccess
  // first shipped in it.
  implementation "com.google.android.gms:play-services-auth:21.4.0"
}
